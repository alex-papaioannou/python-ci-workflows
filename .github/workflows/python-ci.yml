name: Reusable Python CI
on:
  workflow_call:
    inputs:
      python-versions:
        description: "JSON array of Python versions"
        type: string
        default: "[\"3.11\", \"3.12\", \"3.13\"]"
      test-directory:
        description: "Unittest discovery directory"
        type: string
        default: "tests"
      test-pattern:
        description: "Unittest filename glob"
        type: string
        default: "test*.py"
      working-directory:
        description: "Project directory inside the checkout"
        type: string
        default: "."
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        shell: python
        env:
          TEST_DIRECTORY: ${{ inputs.test-directory }}
          TEST_PATTERN: ${{ inputs.test-pattern }}
        run: |
          import compileall
          raise SystemExit(0 if compileall.compile_dir(".", quiet=1) else 1)
      - name: Run tests and reject empty test suites
        shell: python
        env:
          TEST_DIRECTORY: ${{ inputs.test-directory }}
          TEST_PATTERN: ${{ inputs.test-pattern }}
        run: |
          import os
          import sys
          import unittest
          sys.path.insert(0, os.getcwd())
          suite = unittest.defaultTestLoader.discover(os.environ.get('TEST_DIRECTORY', 'tests'), pattern=os.environ.get('TEST_PATTERN', 'test*.py'))
          if suite.countTestCases() == 0:
              raise SystemExit('No tests discovered')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
