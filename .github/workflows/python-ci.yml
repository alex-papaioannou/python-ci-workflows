name: Reusable Python CI
on:
  workflow_call:
    outputs:
      result:
        description: "Overall matrix result: success, failure, or cancelled"
        value: ${{ jobs.result.outputs.result }}
    inputs:
      python-versions:
        description: "JSON array of Python versions"
        type: string
        default: "[\"3.11\", \"3.12\", \"3.13\", \"3.14\"]"
      allow-prereleases:
        description: "Allow alpha, beta, and release-candidate Python versions"
        type: boolean
        default: false
      experimental-python-versions:
        description: "JSON array of matrix Python versions whose failures do not fail the run"
        type: string
        default: "[]"
      matrix-exclude:
        description: "JSON array of {os, python-version} objects naming matrix cells to skip"
        type: string
        default: "[]"
      operating-systems:
        description: "JSON array of runner labels, label arrays or runner-group objects"
        type: string
        default: "[\"ubuntu-latest\"]"
      test-directory:
        description: "Directory to discover tests in; empty uses the pytest configuration"
        type: string
        default: "tests"
      test-pattern:
        description: "Filename glob for test modules; empty uses the pytest configuration"
        type: string
        default: "test*.py"
      working-directory:
        description: "Project directory inside the checkout"
        type: string
        default: "."
      top-level-directory:
        description: "Optional unittest import root"
        type: string
        default: ""
      test-verbosity:
        description: "Test output verbosity: 0, 1, or 2"
        type: number
        default: 2
      test-fail-fast:
        description: "Stop the test run after the first failure"
        type: boolean
        default: false
      timeout-minutes:
        description: "Per-job timeout in minutes"
        type: number
        default: 10
      max-parallel:
        description: "Maximum simultaneous matrix jobs; the default runs the whole matrix at once"
        type: number
        default: 256
      compile-paths:
        description: "JSON array of files or directories to syntax-check"
        type: string
        default: "[\".\"]"
      compile-exclude:
        description: "Regex of paths to exclude from compilation"
        type: string
        default: ""
      warnings-as-errors:
        description: "Treat Python warnings as errors"
        type: boolean
        default: false
      hash-seed:
        description: "Python hash seed: random or integer 0 through 4294967295"
        type: string
        default: "0"
      requirements-file:
        description: "Optional requirements file to install: a requirements .txt, uv.lock or pylock.toml"
        type: string
        default: ""
      require-hashes:
        description: "Require hashes for every installed requirement"
        type: boolean
        default: true
      ruff-version:
        description: "Ruff version to run lint checks with; empty disables Ruff"
        type: string
        default: ""
      ruff-format:
        description: "Also run ruff format --check when Ruff is enabled"
        type: boolean
        default: true
      lint-paths:
        description: "JSON array of files or directories for lint and type checks"
        type: string
        default: "[\".\"]"
      mypy-version:
        description: "mypy version to type-check lint-paths with; empty disables mypy"
        type: string
        default: ""
      coverage-version:
        description: "coverage.py version to measure tests with; empty disables coverage"
        type: string
        default: ""
      coverage-fail-under:
        description: "Minimum total coverage percentage from 0 to 100"
        type: number
        default: 0
      build-package:
        description: "Build an sdist and wheel and validate their metadata"
        type: boolean
        default: false
      call-name:
        description: "Optional name that tells apart several calls of this workflow from one caller workflow"
        type: string
        default: ""
      result-runner:
        description: "Runner for the final result job: a label, or one runner as a JSON label array or runner-group object"
        type: string
        default: "ubuntu-latest"
      cancel-in-progress:
        description: "Cancel this job when a newer run starts for the same ref"
        type: boolean
        default: false
      junit-file:
        description: "Optional JUnit XML report path, uploaded as an artifact"
        type: string
        default: ""
      test-runner:
        description: "Test runner: unittest, pytest, or auto to choose from the project's files"
        type: string
        default: "unittest"
      pytest-version:
        description: "pytest version installed when the test runner is pytest"
        type: string
        default: "9.1.1"
      pytest-args:
        description: "Extra pytest arguments, split like a shell command line"
        type: string
        default: ""
      install-project:
        description: "Install the project itself in editable mode"
        type: boolean
        default: false
      project-extras:
        description: "Comma-separated optional dependency groups to install with the project"
        type: string
        default: ""
      installer:
        description: "Package installer for requirements and the project: pip or uv; a uv.lock or pylock.toml requirements-file always uses uv"
        type: string
        default: "pip"
      uv-version:
        description: "uv version used when installing with uv"
        type: string
        default: "0.13.4"
      audit-version:
        description: "pip-audit version to scan installed dependencies with; empty disables the audit"
        type: string
        default: ""
      audit-ignore:
        description: "JSON array of vulnerability IDs for pip-audit to ignore"
        type: string
        default: "[]"
      test-wheel:
        description: "Also run the tests against the built wheel in a clean environment"
        type: boolean
        default: false
      upload-dist:
        description: "Upload the built distributions as the dist artifact for a publish job in the calling workflow"
        type: boolean
        default: false
      doctest-paths:
        description: "JSON array of modules or directories whose docstring examples run as tests"
        type: string
        default: "[]"
      env:
        description: "JSON object of environment variables set for every step after input validation"
        type: string
        default: "{}"
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    continue-on-error: ${{ contains(fromJSON(inputs.experimental-python-versions), matrix.python-version) }}
    concurrency:
      group: ${{ inputs.cancel-in-progress && format('python-ci-{0}-{1}-{2}-{3}-{4}', github.workflow, github.ref, inputs.working-directory, inputs.call-name, strategy.job-index) || format('python-ci-{0}-{1}-{2}-{3}-{4}', github.run_id, github.run_attempt, inputs.working-directory, inputs.call-name, strategy.job-index) }}
      cancel-in-progress: ${{ inputs.cancel-in-progress }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      PYTHONWARNINGS: ${{ inputs.warnings-as-errors && 'error' || 'default' }}
      PYTHONHASHSEED: ${{ inputs.hash-seed }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        os: ${{ fromJSON(inputs.operating-systems) }}
        python-version: ${{ fromJSON(inputs.python-versions) }}
        exclude: ${{ fromJSON(inputs.matrix-exclude) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ inputs.allow-prereleases }}
          # The caller publishes what upload-dist uploads, so that call restores no pip
          # cache another run could have written. Callers limit cache access with their
          # own job-level cache-mode; never declare one here, because a called workflow
          # that asks for more than its caller allows does not start.
          cache: ${{ !inputs.upload-dist && (inputs.requirements-file != '' || inputs.install-project) && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.requirements-file != '' && format('{0}/{1}', inputs.working-directory, inputs.requirements-file) || inputs.install-project && format('{0}/pyproject.toml', inputs.working-directory) || '' }}
      - name: Load step scripts
        uses: $/.github/actions/python-ci
      - name: Validate inputs
        id: validate
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          OPERATING_SYSTEMS: ${{ inputs.operating-systems }}
          PYTHON_VERSIONS: ${{ inputs.python-versions }}
          EXPERIMENTAL_PYTHON_VERSIONS: ${{ inputs.experimental-python-versions }}
          MATRIX_EXCLUDE: ${{ inputs.matrix-exclude }}
          MATRIX_OS: ${{ toJSON(matrix.os) }}
          MATRIX_PYTHON: ${{ matrix.python-version }}
          TEST_DIRECTORY: ${{ inputs.test-directory }}
          TEST_PATTERN: ${{ inputs.test-pattern }}
          TOP_LEVEL_DIRECTORY: ${{ inputs.top-level-directory }}
          TEST_VERBOSITY: ${{ inputs.test-verbosity }}
          TEST_FAIL_FAST: ${{ inputs.test-fail-fast }}
          COMPILE_PATHS: ${{ inputs.compile-paths }}
          COMPILE_EXCLUDE: ${{ inputs.compile-exclude }}
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
          RUFF_VERSION: ${{ inputs.ruff-version }}
          LINT_PATHS: ${{ inputs.lint-paths }}
          MYPY_VERSION: ${{ inputs.mypy-version }}
          COVERAGE_VERSION: ${{ inputs.coverage-version }}
          COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
          BUILD_PACKAGE: ${{ inputs.build-package }}
          JUNIT_FILE: ${{ inputs.junit-file }}
          TEST_RUNNER: ${{ inputs.test-runner }}
          PYTEST_VERSION: ${{ inputs.pytest-version }}
          PYTEST_ARGS: ${{ inputs.pytest-args }}
          CALL_NAME: ${{ inputs.call-name }}
          INSTALL_PROJECT: ${{ inputs.install-project }}
          PROJECT_EXTRAS: ${{ inputs.project-extras }}
          INSTALLER: ${{ inputs.installer }}
          UV_VERSION: ${{ inputs.uv-version }}
          AUDIT_VERSION: ${{ inputs.audit-version }}
          AUDIT_IGNORE: ${{ inputs.audit-ignore }}
          TEST_WHEEL: ${{ inputs.test-wheel }}
          UPLOAD_DIST: ${{ inputs.upload-dist }}
          DOCTEST_PATHS: ${{ inputs.doctest-paths }}
          CALLER_ENV: ${{ inputs.env }}
        run: python "$PYTHON_CI_STEPS" validate
      - name: Install dependencies
        id: install
        if: inputs.requirements-file != '' || inputs.install-project
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
          REQUIRE_HASHES: ${{ inputs.require-hashes }}
          INSTALL_PROJECT: ${{ inputs.install-project }}
          PROJECT_EXTRAS: ${{ inputs.project-extras }}
          INSTALLER: ${{ steps.validate.outputs.installer }}
          UV_VERSION: ${{ inputs.uv-version }}
        run: python "$PYTHON_CI_STEPS" install
      - name: Audit dependencies
        id: audit
        if: inputs.audit-version != '' && steps.validate.outputs.primary == 'true'
        env:
          AUDIT_VERSION: ${{ inputs.audit-version }}
          AUDIT_IGNORE: ${{ inputs.audit-ignore }}
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: python "$PYTHON_CI_STEPS" audit
      - name: Lint with Ruff
        id: ruff
        if: inputs.ruff-version != '' && steps.validate.outputs.primary == 'true'
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
          RUFF_FORMAT: ${{ inputs.ruff-format }}
          LINT_PATHS: ${{ inputs.lint-paths }}
        run: python "$PYTHON_CI_STEPS" ruff
      - name: Type-check with mypy
        id: mypy
        if: inputs.mypy-version != ''
        env:
          MYPY_VERSION: ${{ inputs.mypy-version }}
          LINT_PATHS: ${{ inputs.lint-paths }}
        run: python "$PYTHON_CI_STEPS" mypy
      - name: Check Python syntax
        id: compile
        env:
          COMPILE_PATHS: ${{ inputs.compile-paths }}
          COMPILE_EXCLUDE: ${{ inputs.compile-exclude }}
        run: python "$PYTHON_CI_STEPS" compile
      - name: Build and check package
        id: build
        if: inputs.build-package && steps.validate.outputs.primary == 'true'
        env:
          TEST_WHEEL: ${{ inputs.test-wheel }}
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
          REQUIRE_HASHES: ${{ inputs.require-hashes }}
          INSTALLER: ${{ steps.validate.outputs.installer }}
          PROJECT_EXTRAS: ${{ inputs.project-extras }}
          TEST_RUNNER: ${{ steps.validate.outputs.test-runner }}
          PYTEST_VERSION: ${{ inputs.pytest-version }}
          TEST_DIRECTORY: ${{ inputs.test-directory }}
          TEST_PATTERN: ${{ inputs.test-pattern }}
        run: python "$PYTHON_CI_STEPS" build
      - name: Upload distributions
        if: inputs.upload-dist && steps.validate.outputs.primary == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist${{ steps.validate.outputs.artifact-suffix }}
          path: ${{ runner.temp }}/python-ci-dist
          if-no-files-found: error
      - name: Install test tools
        id: test-tools
        # The tests depend only on validation and installation, so a failed lint, type,
        # syntax or build check still leaves test results; 'Summarise checks' records
        # which check failed.
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && steps.install.outcome != 'failure' && (inputs.coverage-version != '' || steps.validate.outputs.test-runner == 'pytest') }}
        env:
          COVERAGE_VERSION: ${{ inputs.coverage-version }}
          TEST_RUNNER: ${{ steps.validate.outputs.test-runner }}
          PYTEST_VERSION: ${{ inputs.pytest-version }}
        run: python "$PYTHON_CI_STEPS" install-test-tools
      - name: Run tests and reject empty test suites
        id: test
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && steps.install.outcome != 'failure' && steps.test-tools.outcome != 'failure' }}
        env:
          TEST_DIRECTORY: ${{ inputs.test-directory }}
          TEST_PATTERN: ${{ inputs.test-pattern }}
          TOP_LEVEL_DIRECTORY: ${{ inputs.top-level-directory }}
          TEST_VERBOSITY: ${{ inputs.test-verbosity }}
          TEST_FAIL_FAST: ${{ inputs.test-fail-fast }}
          COVERAGE_VERSION: ${{ inputs.coverage-version }}
          COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
          JUNIT_FILE: ${{ inputs.junit-file }}
          TEST_RUNNER: ${{ steps.validate.outputs.test-runner }}
          PYTEST_ARGS: ${{ inputs.pytest-args }}
          DOCTEST_PATHS: ${{ inputs.doctest-paths }}
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: python "$PYTHON_CI_STEPS" test
      - name: Upload JUnit report
        if: always() && inputs.junit-file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ steps.validate.outputs.os-slug || matrix.os }}-${{ matrix.python-version }}${{ steps.validate.outputs.artifact-suffix }}
          path: ${{ inputs.working-directory }}/${{ inputs.junit-file }}
          if-no-files-found: ignore
      - name: Upload coverage report
        if: always() && inputs.coverage-version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ steps.validate.outputs.os-slug || matrix.os }}-${{ matrix.python-version }}${{ steps.validate.outputs.artifact-suffix }}
          path: ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: ignore
      - name: Summarise checks
        if: ${{ always() && steps.validate.outcome != 'skipped' }}
        # The table needs no project files, so a missing working-directory, which fails
        # validation, does not stop it either.
        working-directory: ${{ github.workspace }}
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          MYPY_OUTCOME: ${{ steps.mypy.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_TOOLS_OUTCOME: ${{ steps.test-tools.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PRIMARY: ${{ steps.validate.outputs.primary }}
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
          INSTALL_PROJECT: ${{ inputs.install-project }}
          INSTALLER: ${{ steps.validate.outputs.installer }}
          UV_VERSION: ${{ inputs.uv-version }}
          AUDIT_VERSION: ${{ inputs.audit-version }}
          RUFF_VERSION: ${{ inputs.ruff-version }}
          MYPY_VERSION: ${{ inputs.mypy-version }}
          BUILD_PACKAGE: ${{ inputs.build-package }}
          TEST_RUNNER: ${{ steps.validate.outputs.test-runner }}
          PYTEST_VERSION: ${{ inputs.pytest-version }}
          COVERAGE_VERSION: ${{ inputs.coverage-version }}
        run: python "$PYTHON_CI_STEPS" checks
  result:
    name: result
    needs: test
    if: always()
    runs-on: ${{ (startsWith(inputs.result-runner, '[') || startsWith(inputs.result-runner, '{')) && fromJSON(inputs.result-runner) || inputs.result-runner }}
    timeout-minutes: 5
    outputs:
      result: ${{ needs.test.result }}
    steps:
      # No checkout and no Python: this job only turns the matrix result into one
      # check, so it works on any runner, including ones without Python.
      - name: Fail because the matrix result is ${{ needs.test.result }}
        if: needs.test.result != 'success'
        run: exit 1
