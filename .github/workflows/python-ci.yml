name: Reusable Python CI
on:
  workflow_call:
    inputs:
      python-versions:
        description: "JSON array of Python versions"
        type: string
        default: "[\"3.11\", \"3.12\", \"3.13\"]"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        shell: python
        run: |
          import compileall
          raise SystemExit(0 if compileall.compile_dir(".", quiet=1) else 1)
      - name: Run tests and reject empty test suites
        shell: python
        run: |
          import os
          import sys
          import unittest
          sys.path.insert(0, os.getcwd())
          suite = unittest.defaultTestLoader.discover('tests')
          if suite.countTestCases() == 0:
              raise SystemExit('No tests discovered')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
