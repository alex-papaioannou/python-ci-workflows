name: Workflow smoke test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml so a release waits for these checks on the same commit.
  workflow_call:
permissions:
  contents: read
jobs:
  smoke:
    uses: ./.github/workflows/python-ci.yml
    with:
      ruff-version: "0.17.0"
      coverage-version: "7.16.2"
      junit-file: "test-results/junit.xml"
      operating-systems: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      python-versions: '["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15"]'
      allow-prereleases: true
      experimental-python-versions: '["3.14t", "3.15"]'
      max-parallel: 18
      mypy-version: "2.4.0"
      lint-paths: '["tests", ".github/actions/python-ci", ".github/scripts"]'
      requirements-file: requirements-dev.txt
      audit-version: "2.10.1"
