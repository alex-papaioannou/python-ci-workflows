name: Release
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # The checks below run on the exact commit being released. Releases happen only
  # from main in this repository, and only after every check passes.
  ci:
    if: github.repository == 'alex-papaioannou/python-ci-workflows' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  examples:
    if: github.repository == 'alex-papaioannou/python-ci-workflows' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/examples.yml
  lint:
    if: github.repository == 'alex-papaioannou/python-ci-workflows' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/workflow-lint.yml
  release:
    needs: [ci, examples, lint]
    if: github.repository == 'alex-papaioannou/python-ci-workflows' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Record the checks that gated this release
        env:
          CI_RESULT: ${{ needs.ci.result }}
          EXAMPLES_RESULT: ${{ needs.examples.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          {
            echo "### Release gates for $GITHUB_SHA"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Workflow smoke test | $CI_RESULT |"
            echo "| Example consumers | $EXAMPLES_RESULT |"
            echo "| Workflow lint | $LINT_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the newest changelog entry
        id: notes
        run: python3 .github/scripts/release_notes.py "$RUNNER_TEMP/notes.md"
      - name: Publish the release and move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          MAJOR: ${{ steps.notes.outputs.major }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to do."
            exit 0
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$MAJOR" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$MAJOR" -f sha="$GITHUB_SHA"
          fi
          echo "Released v$VERSION and pointed $MAJOR at $GITHUB_SHA"
