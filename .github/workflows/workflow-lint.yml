name: Workflow lint
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install linters
        run: python -m pip install --disable-pip-version-check actionlint-py==1.7.12.25 zizmor==1.30.1
      - name: Run actionlint
        run: actionlint
      - name: Run zizmor
        run: zizmor --offline --min-severity medium .github/workflows
