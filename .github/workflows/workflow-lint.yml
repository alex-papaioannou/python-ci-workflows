name: Workflow lint
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install linters
        run: python -m pip install --disable-pip-version-check actionlint-py==1.7.12.25 zizmor==1.30.1
      - name: Run actionlint
        run: actionlint
      - name: Run zizmor
        run: zizmor --offline --min-severity medium .github/workflows
